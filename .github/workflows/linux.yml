name: linux-check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.7"
          cache-dependency-path: app/go.sum
      - run: go -C app test ./...
      - run: python3 scripts/build-linux.py
      - name: Startup check
        run: |
          v=$(sed -n 's/^const AppVersion = "\(.*\)"/\1/p' app/update.go)
          python3 scripts/smoke-linux.py "dist/Wakeloom-$v-linux-amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: Wakeloom-linux
          path: dist/
